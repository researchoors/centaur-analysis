<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centaur — Component Graph</title>

<style>
:root {
  --bg:#0d1117; --surface:#161b22; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
  --green:#3fb950; --red:#f85149; --purple:#a371f7; --orange:#d2991d;
  --font:'SF Mono','Fira Code',monospace;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;height:100vh}

#app{display:flex;flex-direction:column;height:100vh}
#toolbar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
#toolbar h1{font-size:1.1rem;font-weight:700;color:#fff;white-space:nowrap}
#toolbar .stats{font-size:0.72rem;color:var(--muted);white-space:nowrap}
#search{width:220px;padding:6px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:0.78rem;font-family:var(--body)}
#search:focus{outline:none;border-color:var(--accent)}
#search::placeholder{color:var(--muted)}
#toolbar button{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:0.72rem;font-weight:600;white-space:nowrap}
#toolbar button:hover{border-color:var(--accent);color:var(--text)}
#toolbar button.active{background:var(--accent);border-color:var(--accent);color:#000}

#graph-container{flex:1;position:relative;overflow:hidden}
#graph-container svg{width:100%;height:100%}

#legend{position:absolute;top:12px;left:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:0.68rem;z-index:5}
#legend .row{display:flex;align-items:center;gap:6px;margin:3px 0}
#legend .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

#tooltip{position:absolute;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:0.72rem;pointer-events:none;z-index:20;max-width:340px;box-shadow:0 4px 20px rgba(0,0,0,0.5);opacity:0;transition:opacity 0.15s}
#tooltip .tt-name{font-weight:700;font-family:var(--font);color:#fff;margin-bottom:3px}
#tooltip .tt-desc{color:var(--muted);line-height:1.45;font-size:0.7rem}
#tooltip .tt-meta{color:var(--text);font-size:0.65rem;margin-top:4px;font-family:var(--font)}
#tooltip .tt-kind{display:inline-block;font-size:0.6rem;padding:1px 6px;border-radius:8px;font-weight:600;text-transform:uppercase}
.tt-internal{background:#3fb95022;color:var(--green)}
.tt-external{background:#f8514922;color:var(--red)}

#detail-panel{position:absolute;bottom:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 18px;font-size:0.72rem;z-index:5;max-width:320px;display:none}
#detail-panel .dp-name{font-weight:700;font-family:var(--font);color:#fff;margin-bottom:4px}
#detail-panel .dp-desc{color:var(--muted);line-height:1.45;font-size:0.7rem}
#detail-panel .dp-deps{color:var(--muted);font-size:0.65rem;margin-top:6px}
#detail-panel .dp-close{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}

.hull{fill:none;stroke-dasharray:6,4;stroke-width:1.5;pointer-events:none}
.hull-label{font-size:0.75rem;font-weight:700;text-anchor:middle;pointer-events:none;font-family:var(--font)}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <h1>Centaur</h1>
    <span class="stats" id="graph-stats"></span>
    <input type="text" id="search" placeholder="Search components..." autocomplete="off">
    <button id="btn-reset">Reset</button>
    <button id="btn-internal">Internal only</button>
    <button id="btn-external">External only</button>
    <a href="https://github.com/researchoors/centaur-analysis" style="font-size:0.7rem;color:var(--muted);text-decoration:none;margin-left:auto">source →</a>
  </div>
  <div id="graph-container">
    <div id="legend">
      <div class="row"><span class="dot" style="background:var(--green)"></span> Internal component</div>
      <div class="row"><span class="dot" style="background:var(--red)"></span> External dependency</div>
      <div class="row" style="margin-top:4px"><span style="color:var(--muted);font-size:0.6rem">■ library &nbsp; ◆ cli &nbsp; ▲ service &nbsp; ▼ frontend</span></div>
    </div>
    <div id="tooltip"></div>
    <div id="detail-panel"><button class="dp-close" id="dp-close">×</button><div class="dp-name"></div><div class="dp-desc"></div><div class="dp-deps"></div></div>
  </div>
</div>

","target":"ext:typer","type":"external"},{"source":"googlenews","target":"ext:rich","type":"external"},{"source":"harmonic","target":"ext:httpx","type":"external"},{"source":"harmonic","target":"ext:typer","type":"external"},{"source":"harmonic","target":"ext:rich","type":"external"},{"source":"invest-intake","target":"ext:typer","type":"external"},{"source":"investmemos","target":"ext:asyncpg","type":"external"},{"source":"legistorm","target":"ext:httpx","type":"external"},{"source":"legistorm","target":"ext:typer","type":"external"},{"source":"legistorm","target":"ext:rich","type":"external"},{"source":"listennotes","target":"ext:httpx","type":"external"},{"source":"listennotes","target":"ext:typer","type":"external"},{"source":"listennotes","target":"ext:rich","type":"external"},{"source":"newsapi","target":"ext:httpx","type":"external"},{"source":"newsapi","target":"ext:typer","type":"external"},{"source":"newsapi","target":"ext:rich","type":"external"},{"source":"openfec","target":"ext:httpx","type":"external"},{"source":"openfec","target":"ext:typer","type":"external"},{"source":"openfec","target":"ext:rich","type":"external"},{"source":"plural","target":"ext:httpx","type":"external"},{"source":"plural","target":"ext:typer","type":"external"},{"source":"plural","target":"ext:rich","type":"external"},{"source":"sensortower","target":"ext:httpx","type":"external"},{"source":"sensortower","target":"ext:typer","type":"external"},{"source":"sensortower","target":"ext:rich","type":"external"},{"source":"similarweb","target":"ext:httpx","type":"external"},{"source":"similarweb","target":"ext:typer","type":"external"},{"source":"similarweb","target":"ext:rich","type":"external"},{"source":"similarweb","target":"ext:python-dotenv","type":"external"},{"source":"websearch","target":"ext:anthropic","type":"external"},{"source":"websearch","target":"ext:httpx","type":"external"},{"source":"websearch","target":"ext:parallel-web","type":"external"},{"source":"websearch","target":"ext:pydantic","type":"external"},{"source":"websearch","target":"ext:python-dotenv","type":"external"},{"source":"websearch","target":"ext:rich","type":"external"},{"source":"websearch","target":"ext:typer","type":"external"},{"source":"youtube","target":"ext:httpx","type":"external"},{"source":"youtube","target":"ext:typer","type":"external"},{"source":"youtube","target":"ext:rich","type":"external"},{"source":"youtube","target":"ext:python-dotenv","type":"external"},{"source":"centaur-docs","target":"ext:react","type":"external"},{"source":"centaur-docs","target":"ext:react-dom","type":"external"},{"source":"centaur-docs","target":"ext:vocs","type":"external"},{"source":"centaur-docs","target":"ext:waku","type":"external"},{"source":"@centaur/api-client","target":"@centaur/harness-events","type":"internal"},{"source":"@centaur/api-client","target":"ext:axios","type":"external"},{"source":"@centaur/api-client","target":"ext:eventsource-parser","type":"external"},{"source":"slackbot","target":"ext:@opentelemetry/api","type":"external"},{"source":"slackbot","target":"ext:@opentelemetry/exporter-trace-otlp-proto","type":"external"},{"source":"slackbot","target":"ext:@opentelemetry/resources","type":"external"},{"source":"slackbot","target":"ext:@opentelemetry/sdk-trace-base","type":"external"},{"source":"slackbot","target":"ext:@opentelemetry/sdk-trace-node","type":"external"},{"source":"slackbot","target":"ext:@opentelemetry/semantic-conventions","type":"external"},{"source":"slackbot","target":"ext:@slack/types","type":"external"},{"source":"slackbot","target":"ext:@slack/web-api","type":"external"},{"source":"slackbot","target":"ext:@std/ulid","type":"external"},{"source":"slackbot","target":"ext:hono","type":"external"},{"source":"slackbot","target":"ext:zod","type":"external"}]};

// ===== D3 FORCE GRAPH =====
const container = document.getElementById('graph-container');
const tooltip = document.getElementById('tooltip');
const detail = document.getElementById('detail-panel');
const W = container.clientWidth;
const H = container.clientHeight;

// Compute degree
const degree = {};
graph.edges.forEach(e => {
  degree[e.source] = (degree[e.source]||0)+1;
  degree[e.target] = (degree[e.target]||0)+1;
});
graph.nodes.forEach(n => {
  n.degree = degree[n.id] || 0;
  n.r = n.group === 'internal' ? Math.max(4, Math.min(20, 3 + n.degree * 1.5))
                               : Math.max(3, Math.min(16, 2 + n.degree * 0.9));
});

// Shape paths
function shape(d) {
  if (d.group === 'external') return 'circle';
  if (d.kind === 'cli') return 'diamond';
  if (d.kind === 'service') return 'triangle';
  if (d.kind === 'frontend') return 'triangle-down';
  return 'circle';
}

function shapePath(s, r) {
  const p = d3.path();
  if (s === 'diamond') { p.moveTo(0,-r*1.3); p.lineTo(r*1.3,0); p.lineTo(0,r*1.3); p.lineTo(-r*1.3,0); p.closePath(); }
  else if (s === 'triangle') { p.moveTo(0,-r*1.4); p.lineTo(r*1.4,r*0.7); p.lineTo(-r*1.4,r*0.7); p.closePath(); }
  else if (s === 'triangle-down') { p.moveTo(0,r*1.4); p.lineTo(r*1.4,-r*0.7); p.lineTo(-r*1.4,-r*0.7); p.closePath(); }
  else { p.arc(0,0,r,0,2*Math.PI); }
  return p;
}

function nodeColor(d) {
  return d.group === 'internal' ? '#3fb950' : '#f85149';
}

// SVG
const svg = d3.select('#graph-container').append('svg')
  .attr('viewBox', [0,0,W,H]);

const g = svg.append('g');

// Zoom
const zoom = d3.zoom().scaleExtent([0.1, 6]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Force simulation
const linkForce = d3.forceLink(graph.edges).id(d => d.id)
  .distance(d => d.type === 'internal' ? 60 : 100)
  .strength(d => d.type === 'internal' ? 0.4 : 0.08);

const sim = d3.forceSimulation(graph.nodes)
  .force('link', linkForce)
  .force('charge', d3.forceManyBody().strength(d => d.group === 'internal' ? -80 - d.degree*2 : -30 - d.degree))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('collision', d3.forceCollide().radius(d => d.r + 3))
  .force('x', d3.forceX(d => d.group === 'internal' ? W*0.38 : W*0.68).strength(0.015))
  .force('y', d3.forceY(H/2).strength(0.01));

// Hull: convex hull around internal nodes
function drawHull() {
  g.selectAll('.hull-group').remove();
  const pts = graph.nodes.filter(n => n.group === 'internal').map(n => [n.x, n.y]);
  if (pts.length < 3) return;
  // Simple bounding ellipse
  const cx = d3.mean(pts, p => p[0]), cy = d3.mean(pts, p => p[1]);
  const rx = d3.deviation(pts, p => p[0]) * 2.2 + 60;
  const ry = d3.deviation(pts, p => p[1]) * 2.2 + 60;
  const hg = g.append('g').attr('class','hull-group');
  hg.append('ellipse').attr('cx',cx).attr('cy',cy).attr('rx',rx).attr('ry',ry)
    .attr('class','hull').attr('stroke','#3fb95044');
  hg.append('text').attr('x',cx).attr('y',cy-ry-8).attr('class','hull-label').attr('fill','#3fb95088')
    .text('Centaur (80)');
}

// Edges
const link = g.append('g').selectAll('line').data(graph.edges).join('line')
  .attr('stroke', d => d.type === 'internal' ? '#3fb95033' : '#f8514918')
  .attr('stroke-width', d => d.type === 'internal' ? 1.5 : 0.5);

// Nodes
const node = g.append('g').selectAll('g').data(graph.nodes).join('g')
  .attr('cursor', 'pointer')
  .call(d3.drag()
    .on('start', (e,d) => { if(!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on('drag', (e,d) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

node.append('path')
  .attr('d', d => shapePath(shape(d), d.r))
  .attr('fill', d => nodeColor(d))
  .attr('fill-opacity', d => d.group === 'internal' ? 0.85 : 0.45)
  .attr('stroke', d => nodeColor(d))
  .attr('stroke-width', 1);

// Labels for high-degree nodes
const labeledNodes = graph.nodes.filter(n => n.degree >= 5 || ['centaur-api','centaur-sdk','slackbot','centaur-docs','@centaur/api-client'].includes(n.id));
const labels = g.append('g').selectAll('text').data(labeledNodes).join('text')
  .text(d => d.name)
  .attr('font-size', d => Math.max(6, Math.min(10, d.r * 0.7)))
  .attr('fill', '#8b949e')
  .attr('text-anchor', 'middle')
  .attr('dy', d => d.r + 8)
  .attr('font-family', 'SF Mono, monospace')
  .style('pointer-events', 'none');

// Interaction
let selectedId = null;

node.on('mouseover', (e, d) => {
  tooltip.style('opacity', 1)
    .html(`<div class="tt-name">${d.name} <span class="tt-kind tt-${d.group}">${d.kind||d.group}</span></div>
           <div class="tt-desc">${d.description||(d.group==='external'?'External dependency':'Centaur component')}</div>
           <div class="tt-meta">${d.group==='internal'?`Kind: ${d.kind} · Path: ${d.root_path||'—'}`:''} Connections: ${d.degree}</div>`);
}).on('mousemove', e => {
  const [mx,my] = d3.pointer(e, container);
  tooltip.style('left',(mx+14)+'px').style('top',(my-14)+'px');
}).on('mouseout', () => { if(!selectedId) tooltip.style('opacity',0); });

node.on('click', (e, d) => {
  e.stopPropagation();
  if (selectedId === d.id) {
    selectedId = null;
    resetHighlight();
    detail.style.display = 'none';
    return;
  }
  selectedId = d.id;
  const connected = new Set();
  graph.edges.forEach(ed => { if(ed.source===d.id||ed.target===d.id){connected.add(ed.source);connected.add(ed.target);} });

  // Show detail panel
  detail.style.display = 'block';
  detail.querySelector('.dp-name').textContent = d.name;
  detail.querySelector('.dp-desc').textContent = d.description || (d.group==='external'?'External dependency':'Centaur component');
  let depsText = `Connections: ${d.degree}`;
  if (d.group === 'internal') {
    if (d.internal_deps.length) depsText += `\nInternal deps: ${d.internal_deps.join(', ')}`;
    const extDeps = d.external_deps.slice(0, 10);
    if (extDeps.length) depsText += `\nExternal deps: ${extDeps.join(', ')}${d.external_deps.length>10?' +'+(d.external_deps.length-10)+' more':''}`;
  }
  detail.querySelector('.dp-deps').textContent = depsText;

  // Highlight
  node.select('path').attr('opacity', n => connected.has(n.id)||n.id===d.id ? 1 : 0.1);
  link.attr('opacity', e => (e.source===d.id||e.target===d.id) ? 1 : 0.03);
  labels.attr('opacity', n => connected.has(n.id)||n.id===d.id ? 1 : 0.08);
});

svg.on('click', () => { selectedId=null; resetHighlight(); detail.style.display='none'; });
document.getElementById('dp-close').addEventListener('click', () => { selectedId=null; resetHighlight(); detail.style.display='none'; });

function resetHighlight() {
  node.select('path').attr('opacity', 1);
  link.attr('opacity', 1);
  labels.attr('opacity', 1);
}

// Search
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { resetHighlight(); return; }
  const matches = new Set(graph.nodes.filter(n => n.name.toLowerCase().includes(q)).map(n => n.id));
  node.select('path').attr('opacity', n => matches.has(n.id) ? 1 : 0.08);
  link.attr('opacity', e => matches.has(e.source)&&matches.has(e.target) ? 1 : 0.01);
  labels.attr('opacity', n => matches.has(n.id) ? 1 : 0.05);
});

// Filter buttons
document.getElementById('btn-internal').addEventListener('click', function() {
  this.classList.toggle('active');
  const showInternal = this.classList.contains('active');
  node.select('path').attr('opacity', n => n.group==='internal'?1:showInternal?1:0.05);
  if (!showInternal) resetHighlight();
});
document.getElementById('btn-external').addEventListener('click', function() {
  this.classList.toggle('active');
  const showExternal = this.classList.contains('active');
  node.select('path').attr('opacity', n => n.group==='external'?1:showExternal?1:0.05);
  if (!showExternal) resetHighlight();
});

document.getElementById('btn-reset').addEventListener('click', () => {
  sim.alpha(0.5).restart();
  resetHighlight();
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
});

// Stats
document.getElementById('graph-stats').textContent =
  `${graph.nodes.filter(n=>n.group==='internal').length} internal · ${graph.nodes.filter(n=>n.group==='external').length} external · ${graph.edges.length} edges`;

// Tick
sim.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
  labels.attr('x', d=>d.x).attr('y', d=>d.y);
  drawHull();
});
</script>
</body>
</html>
