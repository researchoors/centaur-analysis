<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centaur — Service Architecture</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
#bar h1{font-size:1rem;font-weight:700;color:#fff}
#bar span{font-size:0.7rem;color:var(--muted)}
#bar a{font-size:0.7rem;color:var(--muted);text-decoration:none;margin-left:auto}
#viz{flex:1;position:relative;overflow:hidden;min-height:400px}
#viz svg{position:absolute;top:0;left:0;width:100%;height:100%}
#tip{position:absolute;background:var(--surface);border:1px solid #58a6ff;border-radius:8px;padding:10px 14px;font-size:0.72rem;pointer-events:none;z-index:20;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,0.5);opacity:0;transition:opacity 0.1s}
#tip .n{font-weight:700;font-family:'SF Mono',monospace;color:#fff}
#tip .d{color:var(--muted);line-height:1.45;font-size:0.68rem;margin-top:3px}
#tip .m{color:var(--text);font-size:0.62rem;margin-top:3px;font-family:'SF Mono',monospace}
#pnl{position:absolute;bottom:12px;right:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:0.7rem;max-width:300px;display:none;z-index:5}
#pnl .pn{font-weight:700;font-family:'SF Mono',monospace;color:#fff}
#pnl .pd{color:var(--muted);line-height:1.4;font-size:0.66rem;margin-top:2px}
#pnl .pe{color:var(--muted);font-size:0.6rem;margin-top:4px;font-family:'SF Mono',monospace}
#pnl button{position:absolute;top:4px;right:6px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}

/* loading state */
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--muted);font-size:0.85rem;z-index:1}
</style>
</head>
<body>
<div id="bar"><h1>Centaur · Service Architecture</h1><span>Drag · Zoom · Click</span><a href="https://github.com/researchoors/centaur-analysis">source →</a></div>
<div id="viz"><div id="loading">Loading D3…</div><div id="tip"></div><div id="pnl"><button id="px">×</button><div class="pn"></div><div class="pd"></div><div class="pe"></div></div></div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
(function(){
  // Ensure DOM and D3 are ready
  if (typeof d3 === 'undefined') {
    document.getElementById('loading').textContent = 'Failed to load D3. Try refreshing.';
    return;
  }
  document.getElementById('loading').style.display = 'none';

  const colors = {
    entry: '#8b949e', platform: '#a371f7', infra: '#f0883e',
    tools: '#3fb950', external: '#f85149'
  };

  // === SERVICE NODES ===
  const nodes = [
    {id:"Slack",g:"entry",d:"Primary user interface. Users send @centaur messages to trigger agents."},
    {id:"REST API",g:"entry",d:"HTTP API for programmatic agent execution."},
    {id:"Web Docs",g:"entry",d:"React 19 + Vocs documentation site."},
    {id:"centaur-api",g:"platform",d:"Central orchestration hub. FastAPI server: agent sessions, K8s sandbox lifecycle, SSE streaming, tool routing."},
    {id:"slackbot",g:"platform",d:"Slack event gateway. Hono + TypeScript: receives webhooks, normalizes events, streams responses back via chat.update."},
    {id:"centaur-docs",g:"platform",d:"Developer docs. React 19 + Vocs, MDX-based API reference."},
    {id:"PostgreSQL",g:"infra",d:"Data store. pgVector embeddings, ParadeDB search, asyncpg pooling. Stores sessions, checkpoints, tool configs."},
    {id:"Kubernetes",g:"infra",d:"Container orchestration. Creates isolated sandbox pods per agent session, enforces security policies, TTL cleanup."},
    {id:"Sandbox Pod",g:"infra",d:"Ephemeral execution environment. One K8s pod per agent session. Contains LLM loop, tool manifest. Destroyed after completion."},
    {id:"Tool Server",g:"infra",d:"Hosts 73 CLI tools. Receives invocations from sandboxes, resolves handlers, injects ${SECRET:KEY} placeholders, forwards to Iron-Proxy."},
    {id:"Iron-Proxy",g:"infra",d:"Secret injection sidecar. Resolves placeholders → real credentials, makes authenticated outbound calls, strips sensitive headers."},
    {id:"centaur-sdk",g:"infra",d:"Tool SDK. secret() placeholder function, tool context, attachments, structured logging."},
    {id:"Crypto & DeFi",g:"tools",d:"23 CLIs: Alchemy, Etherscan, CoinGecko, CoinMetrics, DefiLlama, Messari, Nansen, Polymarket, Kalshi, DeBank, Dune, Allium, TokenTerminal, Tokenomist, Snapshot, Tally, Karma, MPP, Arkham, Databento, EODHD, Reth, Chart",c:23},
    {id:"Research",g:"tools",d:"18 CLIs: Websearch, Crunchbase, Harmonic, SensorTower, SimilarWeb, Congress.gov, FedReg, OpenFEC, LegiStorm, Plural, ListenNotes, YouTube, CoinDesk, TheBlock, GoogleNews, NewsAPI, Archiver, DocSend",c:18},
    {id:"Productivity",g:"tools",d:"10 CLIs: Linear, Notion, Airtable, Google Workspace, Slack search, Figma, Granola, OpenTable, CompanyContext, Composio",c:10},
    {id:"Infra & Monitoring",g:"tools",d:"8 CLIs: Grafana, Sentry, AWS CloudWatch, PostHog, VictoriaMetrics, VictoriaLogs, Profslice, Laminar",c:8},
    {id:"Business",g:"tools",d:"3 CLIs: Ashby (ATS), Attio (CRM), Pylon (Support)",c:3},
    {id:"Media",g:"tools",d:"3 CLIs: NanoBanana (Gemini), Veo3 (video), Transcriber (Whisper)",c:3},
    {id:"Communication",g:"tools",d:"2 CLIs: Telegram, Twitter/X",c:2},
    {id:"Special",g:"tools",d:"6 CLIs: InvestMemos, InvestIntake, StandardMetrics, Eng, Demo, MPP",c:6},
    {id:"Blockchain RPCs",g:"external",d:"Alchemy, Etherscan, Nansen, Allium, Arkham",c:5},
    {id:"Market Data",g:"external",d:"CoinGecko, CoinMetrics, Messari, Databento, EODHD, CoinDesk, TheBlock",c:7},
    {id:"DeFi & Gov",g:"external",d:"DefiLlama, DeBank, Dune, TokenTerminal, Snapshot, Tally, Karma, Polymarket, Kalshi, Tokenomist",c:10},
    {id:"SaaS APIs",g:"external",d:"Linear, Notion, Airtable, Figma, Granola, OpenTable, Ashby, Attio, Pylon",c:9},
    {id:"Google APIs",g:"external",d:"Gmail, Calendar, Drive, Docs, Sheets, Analytics, Gemini, Veo3",c:8},
    {id:"Observability",g:"external",d:"Grafana, Sentry, AWS CloudWatch, PostHog, VictoriaMetrics, VictoriaLogs, Laminar",c:7},
    {id:"Content & Intel",g:"external",d:"Crunchbase, Harmonic, SensorTower, SimilarWeb, Congress.gov, FedReg, OpenFEC, LegiStorm, Plural, ListenNotes, YouTube, Websearch, NewsAPI",c:13},
    {id:"Messaging",g:"external",d:"Slack Web API, Telegram Bot API, Twitter/X API",c:3},
    {id:"Composio Hub",g:"external",d:"1000+ service connector — GitHub, Gmail, Slack, Notion…",c:1},
  ];

  // === SERVICE EDGES ===
  const edges = [
    ["Slack","slackbot"],["REST API","centaur-api"],["Web Docs","centaur-docs"],
    ["slackbot","centaur-api"],
    ["centaur-api","PostgreSQL"],["centaur-api","Kubernetes"],["centaur-api","Sandbox Pod"],
    ["Kubernetes","Sandbox Pod"],
    ["Sandbox Pod","Tool Server"],
    ["centaur-sdk","Tool Server"],
    ["Tool Server","Crypto & DeFi"],["Tool Server","Research"],["Tool Server","Productivity"],
    ["Tool Server","Infra & Monitoring"],["Tool Server","Business"],["Tool Server","Media"],
    ["Tool Server","Communication"],["Tool Server","Special"],
    ["Tool Server","Iron-Proxy"],
    ["Iron-Proxy","Blockchain RPCs"],["Iron-Proxy","Market Data"],["Iron-Proxy","DeFi & Gov"],
    ["Iron-Proxy","SaaS APIs"],["Iron-Proxy","Google APIs"],["Iron-Proxy","Observability"],
    ["Iron-Proxy","Content & Intel"],["Iron-Proxy","Messaging"],["Iron-Proxy","Composio Hub"],
  ];

  // Build maps
  const nmap = {};
  nodes.forEach(n => {
    n.r = n.g==='platform'?22:n.g==='infra'?20:n.g==='entry'?16:11+(n.c||1)*0.5;
    nmap[n.id] = n;
  });
  const emap = edges.map(([s,t]) => ({source:nmap[s],target:nmap[t]}));

  // Color
  function c(g){return colors[g]||'#8b949e';}

  // D3 setup
  const viz = document.getElementById('viz');
  const tip = document.getElementById('tip');
  const pnl = document.getElementById('pnl');
  const W = viz.clientWidth, H = viz.clientHeight;

  const svg = d3.select('#viz').append('svg').attr('viewBox',[0,0,W,H]);
  const g = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.1,5]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoom);

  // Force
  const sim = d3.forceSimulation(nodes)
    .force('link',d3.forceLink(emap).id(d=>d.id).distance(110).strength(0.4))
    .force('charge',d3.forceManyBody().strength(-350))
    .force('center',d3.forceCenter(W/2,H/2))
    .force('collision',d3.forceCollide().radius(d=>d.r+10))
    .force('x',d3.forceX(d=>{
      if(d.g==='entry')return W*0.5;if(d.g==='platform')return W*0.38;
      if(d.g==='infra')return W*0.42;if(d.g==='tools')return W*0.22;
      return W*0.8;
    }).strength(0.05))
    .force('y',d3.forceY(d=>{
      if(d.g==='entry')return H*0.06;if(d.g==='platform')return H*0.18;
      if(d.g==='infra')return H*0.38;if(d.g==='tools')return H*0.65;
      return H*0.52;
    }).strength(0.05));

  // Edges
  const lkg = g.append('g');
  const link = lkg.selectAll('line').data(emap).join('line')
    .attr('stroke',d=>c(d.source.g)+'44').attr('stroke-width',1.5);

  // Nodes
  const ndg = g.append('g');
  const node = ndg.selectAll('g').data(nodes).join('g')
    .attr('cursor','pointer')
    .call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y;})
      .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
      .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

  node.append('circle').attr('r',d=>d.r).attr('fill',d=>c(d.g)).attr('fill-opacity',0.85)
    .attr('stroke',d=>c(d.g)).attr('stroke-width',1.5);

  // Labels
  node.append('text').text(d=>d.id).attr('text-anchor','middle').attr('dy',d=>d.r+10)
    .attr('font-size',d=>d.g==='platform'||d.g==='infra'?'0.58rem':'0.5rem')
    .attr('font-weight',d=>d.g==='platform'||d.g==='infra'?'700':'400')
    .attr('fill','#e6edf3').attr('font-family','SF Mono,monospace').style('pointer-events','none');

  // Count badges
  node.filter(d=>d.c).append('text').text(d=>d.c).attr('text-anchor','middle').attr('dy','0.35em')
    .attr('font-size',d=>Math.max(7,d.r*0.55)+'px').attr('font-weight','700')
    .attr('fill','#fff').attr('font-family','SF Mono,monospace').style('pointer-events','none');

  // Hull groups
  const hullG = g.append('g');
  const groups = {platform:'Platform',infra:'Infrastructure',tools:'Tool Server (73 CLIs)',external:'External APIs'};

  function convexHull(pts,pad){
    if(pts.length<3)return pts;
    pts.sort((a,b)=>a[0]-b[0]);
    const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
    const lo=[],hi=[];
    for(const p of pts){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);}
    for(const p of pts.reverse()){while(hi.length>=2&&cross(hi[hi.length-2],hi[hi.length-1],p)<=0)hi.pop();hi.push(p);}
    const h=lo.concat(hi.slice(1,-1));
    if(h.length<3)return h;
    const cx=d3.mean(h,d=>d[0]),cy=d3.mean(h,d=>d[1]);
    return h.map(([x,y])=>{const dx=x-cx,dy=y-cy,d=Math.sqrt(dx*dx+dy*dy)||1;return[x+dx/d*pad,y+dy/d*pad];});
  }

  // Interaction
  let sel=null;
  node.on('mouseover',(e,d)=>{
    tip.style.opacity=1;
    tip.innerHTML=`<div class="n">${d.id}</div><div class="d">${d.d}</div>${d.c?`<div class="m">${d.c} components</div>`:''}`;
  }).on('mousemove',e=>{
    const[mx,my]=d3.pointer(e,viz);tip.style.left=(mx+14)+'px';tip.style.top=(my-14)+'px';
  }).on('mouseout',()=>{if(!sel)tip.style.opacity=0;});

  node.on('click',(e,d)=>{
    e.stopPropagation();
    sel=(sel===d.id)?null:d.id;
    if(!sel){pnl.style.display='none';resetHl();return;}
    pnl.style.display='block';
    pnl.querySelector('.pn').textContent=d.id;
    pnl.querySelector('.pd').textContent=d.d;
    const conn=emap.filter(ed=>ed.source===d||ed.target===d);
    pnl.querySelector('.pe').textContent=conn.map(ed=>ed.source.id+' → '+ed.target.id).join(' · ');
    node.select('circle').attr('opacity',n=>n===d||conn.some(ed=>ed.source===n||ed.target===n)?1:0.12);
    link.attr('opacity',ed=>ed.source===d||ed.target===d?1:0.04);
  });
  svg.on('click',()=>{sel=null;pnl.style.display='none';resetHl();});
  document.getElementById('px').addEventListener('click',()=>{sel=null;pnl.style.display='none';resetHl();});

  function resetHl(){node.select('circle').attr('opacity',1);link.attr('opacity',1);}

  // Tick
  sim.on('tick',()=>{
    link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    node.attr('transform',d=>`translate(${d.x},${d.y})`);

    hullG.selectAll('*').remove();
    Object.entries(groups).forEach(([grp,label])=>{
      const pts = nodes.filter(n=>n.g===grp).map(n=>[n.x,n.y]);
      if(pts.length<3)return;
      const h = convexHull(pts, 24);
      if(h.length<3)return;
      const cx = d3.mean(pts,p=>p[0]), cy = d3.mean(pts,p=>p[1]), minY = Math.min(...pts.map(p=>p[1]));
      hullG.append('path').attr('d','M'+h.join('L')+'Z').attr('fill','none').attr('stroke',c(grp)+'44')
        .attr('stroke-dasharray','6,4').attr('stroke-width',1.5);
      hullG.append('text').attr('x',cx).attr('y',minY-12).attr('text-anchor','middle')
        .attr('font-size','0.65rem').attr('font-weight','700').attr('fill',c(grp)+'88')
        .attr('font-family','SF Mono,monospace').text(label);
    });
  });

  // Warm up simulation
  for(let i=0;i<300;i++)sim.tick();
  sim.alpha(0.3).restart();
})();
</script>
</body>
</html>
